# Release — tag v<VERSION_NAME> on main → signed APK → GitHub Release (Obtainium reads these).
# DRAFT written before the Gradle project exists; verified and fixed by QMOB-E9-S3 (human-only).
# Secrets (set by the human, never by an agent): QUIRE_KEYSTORE_BASE64, QUIRE_KEYSTORE_PASSWORD,
# QUIRE_KEY_ALIAS, QUIRE_KEY_PASSWORD, GOOGLE_SERVICES_JSON_BASE64 (E8, Firebase client config).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag must be on main and match version.properties
        id: v
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::Tag is not on main"; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          declared="$(grep '^VERSION_NAME=' version.properties | cut -d= -f2)"
          [ "$version" = "$declared" ] || { echo "::error::Tag $GITHUB_REF_NAME != VERSION_NAME $declared"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=" >> "$GITHUB_OUTPUT" ;; esac
      - name: Is signing configured?
        id: signing
        env:
          QUIRE_KEYSTORE_BASE64: ${{ secrets.QUIRE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$QUIRE_KEYSTORE_BASE64" ]; then echo "configured=true" >> "$GITHUB_OUTPUT"; else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets are not configured — tag recorded as a checkpoint, no APK published (pre-E9)."
          fi
      - uses: actions/setup-java@v4
        if: steps.signing.outputs.configured == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.signing.outputs.configured == 'true'
      - name: Unit tests
        if: steps.signing.outputs.configured == 'true'
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Decode keystore to runner temp
        if: steps.signing.outputs.configured == 'true'
        env:
          QUIRE_KEYSTORE_BASE64: ${{ secrets.QUIRE_KEYSTORE_BASE64 }}
        run: printf '%s' "$QUIRE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      # Firebase client config (ADR 0003 §4.1): decoded only for the release build, never committed, removed after.
      # The value travels via env + stdin only (printf is a builtin), never argv; no set -x.
      - name: Decode google-services.json
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 is not set; release APKs must ship with push configured."
            exit 1
          fi
          umask 077
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
      - name: Build signed release APK
        if: steps.signing.outputs.configured == 'true'
        env:
          QUIRE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          QUIRE_KEYSTORE_PASSWORD: ${{ secrets.QUIRE_KEYSTORE_PASSWORD }}
          QUIRE_KEY_ALIAS: ${{ secrets.QUIRE_KEY_ALIAS }}
          QUIRE_KEY_PASSWORD: ${{ secrets.QUIRE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace
      - name: Verify push is configured in the release build
        if: steps.signing.outputs.configured == 'true'
        run: |
          grep -rqs 'PUSH_CONFIGURED = true' app/build/generated/source/buildConfig/release \
            || { echo "::error::Release build has BuildConfig.PUSH_CONFIGURED != true"; exit 1; }
      - name: Remove keystore and google-services.json
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" app/google-services.json
      - name: Name the APK and checksum
        if: steps.signing.outputs.configured == 'true'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/quire-android-${{ steps.v.outputs.version }}.apk"
          [ "$(ls dist/*.apk | wc -l)" -eq 1 ] || { echo "::error::Expected exactly one APK"; exit 1; }
          cd dist && sha256sum *.apk > "quire-android-${{ steps.v.outputs.version }}.apk.sha256"
      - name: Publish GitHub Release
        if: steps.signing.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Quire for Android ${{ steps.v.outputs.version }}" --generate-notes ${{ steps.v.outputs.prerelease }}
